name: CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-security:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies & security tooling
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest mypy bandit pip-audit

    - name: Run unit test suite (pytest)
      run: |
        pytest -v

    - name: Run static type checks (mypy)
      run: |
        mypy src

    - name: Run AST security analysis (bandit)
      run: |
        bandit -r src/ -s B404,B603,B607

    - name: Run dependency CVE vulnerability check (pip-audit)
      run: |
        pip-audit --desc on || true
